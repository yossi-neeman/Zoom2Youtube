<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returning to Zoom to YouTube</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
               background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;
               display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px; }
        .box { background: white; border-radius: 16px; padding: 40px; max-width: 420px; text-align: center;
               box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #667eea; font-size: 1.6rem; margin: 0 0 10px; }
        p { color: #666; }
        a { display: inline-block; margin-top: 15px; padding: 14px 28px; border-radius: 8px; color: white;
            text-decoration: none; font-weight: 600; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body>
    <div class="box">
        <h1>📹 Signed in</h1>
        <p>Returning to the app…</p>
        <a href="{{ app_url }}">Open the app</a>
    </div>
    <script>window.location.href = {{ app_url|tojson }};</script>
</body>
</html>
