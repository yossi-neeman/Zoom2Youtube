version: '3.8'

services:
  zoom2youtube:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      # Mount code for live development
      - ./web_app.py:/app/web_app.py
      - ./zoom_downloader.py:/app/zoom_downloader.py
      - ./youtube_uploader.py:/app/youtube_uploader.py
      - ./zoom_to_youtube.py:/app/zoom_to_youtube.py
      - ./storage.py:/app/storage.py
      - ./version.py:/app/version.py
      - ./templates:/app/templates
      - ./static:/app/static
      
      # Mount persistent directories
      - ./recordings:/app/recordings
      - ./credentials:/app/credentials
    env_file:
      - credentials/.env
    environment:
      # Force local storage for development
      - USE_S3_STORAGE=false
      - PYTHONUNBUFFERED=1
      - PORT=5000
    command: python web_app.py
    restart: unless-stopped

